{% extends "base.html" %}

{% block title %}Edit Chore - Chore Assistant{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <h1 class="text-center mb-4"><i class="fas fa-edit"></i> Edit Chore</h1>
            
            <div class="card">
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label"><strong>Chore Name</strong></label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ chore.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label"><strong>Description</strong></label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ chore.description }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="priority" class="form-label"><strong>Priority (1-5)</strong></label>
                            <input type="number" class="form-control" id="priority" name="priority" min="1" max="5" value="{{ chore.priority }}">
                        </div>

                        <div class="mb-3">
                            <label for="frequency" class="form-label"><strong>Frequency</strong></label>
                            <select class="form-select" id="frequency" name="frequency">
                                <option value="daily" {% if chore.frequency == 'daily' %}selected{% endif %}>Daily</option>
                                <option value="weekly" {% if chore.frequency == 'weekly' %}selected{% endif %}>Weekly</option>
                                <option value="monthly" {% if chore.frequency == 'monthly' %}selected{% endif %}>Monthly</option>
                                <option value="once" {% if chore.frequency == 'once' %}selected{% endif %}>One-time</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="frequency_details" class="form-label"><strong>Frequency Details</strong></label>
                            <input type="text" class="form-control" id="frequency_details" name="frequency_details" value="{{ chore.frequency_details or '' }}" placeholder="e.g., Monday,Wednesday or 15 for 15th">
                            <small class="form-text text-muted d-block mt-2">
                                <strong>Weekly:</strong> comma-separated days (Monday,Wednesday)<br>
                                <strong>Monthly:</strong> day of month (1-31)
                            </small>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="completed" name="completed" {% if chore.completed %}checked{% endif %}>
                                <label class="form-check-label" for="completed">
                                    <strong>Mark as completed</strong>
                                </label>
                            </div>
                        </div>

                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-primary btn-sm">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                            <a href="/chores" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
