{% extends "base.html" %}

{% block title %}Edit Chore{% endblock %}

{% block content %}
    <h1>Edit Chore</h1>
    
    <form method="POST" style="max-width: 500px;">
        <div style="margin-bottom: 15px;">
            <label for="name" style="display: block; margin-bottom: 5px; font-weight: bold;">Chore Name:</label>
            <input type="text" id="name" name="name" value="{{ chore.name }}" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="description" style="display: block; margin-bottom: 5px; font-weight: bold;">Description:</label>
            <textarea id="description" name="description" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; height: 100px;">{{ chore.description }}</textarea>
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="priority" style="display: block; margin-bottom: 5px; font-weight: bold;">Priority (1-5):</label>
            <input type="number" id="priority" name="priority" min="1" max="5" value="{{ chore.priority }}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="completed" style="display: flex; align-items: center; gap: 10px;">
                <input type="checkbox" id="completed" name="completed" {% if chore.completed %}checked{% endif %}>
                <span>Mark as completed</span>
            </label>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" style="background-color: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">Save Changes</button>
            <a href="/chores" style="background-color: #999; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block;">Cancel</a>
        </div>
    </form>
{% endblock %}
